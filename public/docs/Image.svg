<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="heatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- ==================== COLUMN 1: DATA SOURCES ==================== -->
  <g id="col1">
    <!-- Header -->
    <rect x="40" y="50" width="180" height="42" rx="4" fill="#0d7a75" />
    <text x="130" y="76" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Data Sources</text>

    <!-- Outer Box -->
    <rect x="40" y="92" width="180" height="480" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Item 1: Structured Data -->
    <g transform="translate(50, 110)">
      <text x="80" y="18" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="600">Structured Data</text>
      <!-- Table Icon -->
      <rect x="20" y="30" width="55" height="60" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <line x1="20" y1="46" x2="75" y2="46" stroke="#0284c7" stroke-width="1" />
      <line x1="20" y1="60" x2="75" y2="60" stroke="#0284c7" stroke-width="1" />
      <line x1="20" y1="74" x2="75" y2="74" stroke="#0284c7" stroke-width="1" />
      <line x1="45" y1="30" x2="45" y2="90" stroke="#0284c7" stroke-width="1" />
      <!-- Pie Chart Icon -->
      <circle cx="115" cy="60" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
      <path d="M 115 60 L 115 36 A 24 24 0 0 1 139 60 Z" fill="#f97316" />
      <path d="M 115 60 L 139 60 A 24 24 0 0 1 115 84 Z" fill="#10b981" />
    </g>

    <!-- Item 2: News & Reports (Question Papers & Syllabus) -->
    <g transform="translate(50, 230)">
      <text x="80" y="18" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="600">Question Papers &amp; Reports</text>
      <!-- Document Stack -->
      <rect x="25" y="30" width="50" height="60" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <line x1="33" y1="42" x2="65" y2="42" stroke="#94a3b8" stroke-width="2" />
      <line x1="33" y1="52" x2="65" y2="52" stroke="#94a3b8" stroke-width="2" />
      <line x1="33" y1="62" x2="65" y2="62" stroke="#94a3b8" stroke-width="2" />
      <line x1="33" y1="72" x2="55" y2="72" stroke="#94a3b8" stroke-width="2" />

      <rect x="85" y="35" width="50" height="60" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <line x1="93" y1="47" x2="125" y2="47" stroke="#3b82f6" stroke-width="2" />
      <line x1="93" y1="57" x2="125" y2="57" stroke="#3b82f6" stroke-width="2" />
      <line x1="93" y1="67" x2="125" y2="67" stroke="#3b82f6" stroke-width="2" />
      <line x1="93" y1="77" x2="115" y2="77" stroke="#3b82f6" stroke-width="2" />
    </g>

    <!-- Item 3: Alternative Data (Attendance & Barcodes) -->
    <g transform="translate(50, 360)">
      <text x="80" y="18" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="600">Alternative Data</text>
      <!-- Trend Graph & Barcode -->
      <rect x="20" y="30" width="60" height="48" rx="2" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
      <polyline points="26,65 38,50 48,58 62,40 72,45" fill="none" stroke="#10b981" stroke-width="2" />
      <!-- Barcode icon -->
      <rect x="90" y="30" width="55" height="48" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
      <line x1="96" y1="38" x2="96" y2="70" stroke="#000000" stroke-width="3" />
      <line x1="102" y1="38" x2="102" y2="70" stroke="#000000" stroke-width="1.5" />
      <line x1="107" y1="38" x2="107" y2="70" stroke="#000000" stroke-width="4" />
      <line x1="114" y1="38" x2="114" y2="70" stroke="#000000" stroke-width="1.5" />
      <line x1="120" y1="38" x2="120" y2="70" stroke="#000000" stroke-width="3" />
      <line x1="126" y1="38" x2="126" y2="70" stroke="#000000" stroke-width="2" />
      <line x1="133" y1="38" x2="133" y2="70" stroke="#000000" stroke-width="1" />
    </g>

    <!-- Caption -->
    <text x="130" y="545" text-anchor="middle" fill="#475569" font-size="12" font-weight="600">Academic Indicators</text>
  </g>

  <!-- Connector from Col 1 to Col 2 -->
  <line x1="220" y1="210" x2="260" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="220" y1="330" x2="260" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 2: LLM-DRIVEN ANALYSIS ==================== -->
  <g id="col2">
    <!-- Header -->
    <rect x="260" y="50" width="200" height="42" rx="4" fill="#1d4ed8" />
    <text x="360" y="76" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">LLM-Driven Analysis</text>

    <!-- Outer Box -->
    <rect x="260" y="92" width="200" height="480" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Brain Illustration -->
    <g transform="translate(320, 115)">
      <circle cx="40" cy="35" r="30" fill="url(#brainGrad)" opacity="0.9" />
      <!-- Circuit lines -->
      <path d="M 25 35 Q 35 20 50 35 T 55 45" fill="none" stroke="#ffffff" stroke-width="2.5" />
      <circle cx="25" cy="35" r="3" fill="#ffffff" />
      <circle cx="55" cy="45" r="3" fill="#ffffff" />
      <circle cx="45" cy="22" r="2.5" fill="#ffffff" />
      <circle cx="35" cy="48" r="2.5" fill="#ffffff" />
      <path d="M 28 25 L 35 48" stroke="#ffffff" stroke-width="1.5" />
      <path d="M 45 22 L 55 45" stroke="#ffffff" stroke-width="1.5" />
    </g>

    <!-- Sub-Box 1: Large Language Model -->
    <rect x="275" y="195" width="170" height="34" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#boxShadow)" />
    <text x="360" y="217" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="600">Large Language Model</text>

    <!-- Sub-Box 2: Sentiment / Cognitive Level Analysis -->
    <rect x="275" y="245" width="170" height="34" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#boxShadow)" />
    <text x="360" y="267" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="600">Cognitive Bloom's Level</text>

    <!-- Sub-Box 3: Event / CO Detection -->
    <rect x="275" y="295" width="170" height="34" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#boxShadow)" />
    <text x="360" y="317" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="600">Course Outcome Detection</text>

    <!-- Sub-Box 4: Trend / Rubric Extraction -->
    <rect x="275" y="345" width="170" height="34" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#boxShadow)" />
    <text x="360" y="367" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="600">Scoring Rubric Extraction</text>
  </g>

  <!-- Connectors from Col 2 to Col 3 -->
  <line x1="445" y1="212" x2="500" y2="212" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 445 362 H 475 V 260 H 495" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 3: MULTIMODAL MODEL ==================== -->
  <g id="col3">
    <!-- Header -->
    <rect x="500" y="50" width="180" height="42" rx="4" fill="#ea580c" />
    <text x="590" y="70" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Autonomous</text>
    <text x="590" y="85" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Evaluation Model</text>

    <!-- Outer Box -->
    <rect x="500" y="92" width="180" height="480" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Neural Network Graph -->
    <g transform="translate(520, 140)">
      <!-- Input Layer -->
      <circle cx="20" cy="30" r="7" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" />
      <circle cx="20" cy="60" r="7" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" />
      <circle cx="20" cy="90" r="7" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" />
      <circle cx="20" cy="120" r="7" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" />

      <!-- Hidden Layer 1 -->
      <circle cx="70" cy="45" r="7" fill="#f97316" stroke="#ea580c" stroke-width="1.5" />
      <circle cx="70" cy="75" r="7" fill="#f97316" stroke="#ea580c" stroke-width="1.5" />
      <circle cx="70" cy="105" r="7" fill="#f97316" stroke="#ea580c" stroke-width="1.5" />

      <!-- Hidden Layer 2 -->
      <circle cx="115" cy="60" r="7" fill="#0284c7" stroke="#0369a1" stroke-width="1.5" />
      <circle cx="115" cy="90" r="7" fill="#0284c7" stroke="#0369a1" stroke-width="1.5" />

      <!-- Output Node -->
      <circle cx="145" cy="75" r="8" fill="#e11d48" stroke="#be123c" stroke-width="2" />

      <!-- Connecting Lines -->
      <line x1="20" y1="30" x2="70" y2="45" stroke="#94a3b8" stroke-width="1" />
      <line x1="20" y1="30" x2="70" y2="75" stroke="#94a3b8" stroke-width="1" />
      <line x1="20" y1="60" x2="70" y2="45" stroke="#94a3b8" stroke-width="1" />
      <line x1="20" y1="60" x2="70" y2="75" stroke="#94a3b8" stroke-width="1" />
      <line x1="20" y1="90" x2="70" y2="75" stroke="#94a3b8" stroke-width="1" />
      <line x1="20" y1="90" x2="70" y2="105" stroke="#94a3b8" stroke-width="1" />
      <line x1="20" y1="120" x2="70" y2="75" stroke="#94a3b8" stroke-width="1" />
      <line x1="20" y1="120" x2="70" y2="105" stroke="#94a3b8" stroke-width="1" />

      <line x1="70" y1="45" x2="115" y2="60" stroke="#94a3b8" stroke-width="1" />
      <line x1="70" y1="75" x2="115" y2="60" stroke="#94a3b8" stroke-width="1" />
      <line x1="70" y1="75" x2="115" y2="90" stroke="#94a3b8" stroke-width="1" />
      <line x1="70" y1="105" x2="115" y2="90" stroke="#94a3b8" stroke-width="1" />

      <line x1="115" y1="60" x2="145" y2="75" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="115" y1="90" x2="145" y2="75" stroke="#94a3b8" stroke-width="1.5" />
    </g>

    <!-- Monitor Graphic Output -->
    <g transform="translate(565, 305)">
      <rect x="0" y="0" width="50" height="38" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
      <rect x="4" y="4" width="42" height="30" fill="#f1f5f9" />
      <rect x="8" y="10" width="8" height="18" fill="#3b82f6" />
      <rect x="20" y="16" width="8" height="12" fill="#10b981" />
      <rect x="32" y="8" width="8" height="20" fill="#f59e0b" />
      <line x1="25" y1="38" x2="25" y2="46" stroke="#475569" stroke-width="2" />
      <line x1="15" y1="46" x2="35" y2="46" stroke="#475569" stroke-width="2" />
    </g>

    <!-- Output Box: Evaluation Score & Grade -->
    <rect x="520" y="380" width="140" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#boxShadow)" />
    <text x="590" y="403" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="700">Evaluation Score</text>
  </g>

  <!-- Connector from Col 3 to Col 4 -->
  <line x1="680" y1="215" x2="720" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 4: EXPLAINABLE AI ==================== -->
  <g id="col4">
    <!-- Header -->
    <rect x="720" y="50" width="230" height="42" rx="4" fill="#1e3a8a" />
    <text x="835" y="70" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Explainable AI</text>
    <text x="835" y="85" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">for Examination Insights</text>

    <!-- Outer Box -->
    <rect x="720" y="92" width="230" height="480" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Sub-Section 1: SHAP Values -->
    <g transform="translate(740, 110)">
      <rect x="0" y="0" width="190" height="150" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#boxShadow)" />
      <text x="95" y="24" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="700">SHAP Values</text>

      <!-- SHAP Bar Chart -->
      <!-- Center vertical axis line -->
      <line x1="85" y1="40" x2="85" y2="135" stroke="#94a3b8" stroke-width="1" />

      <!-- Row 1: Negative / Positive -->
      <rect x="45" y="45" width="40" height="12" fill="#ef4444" rx="1" />
      <rect x="85" y="45" width="25" height="12" fill="#3b82f6" rx="1" />

      <!-- Row 2 -->
      <rect x="60" y="65" width="25" height="12" fill="#ef4444" rx="1" />
      <rect x="85" y="65" width="60" height="12" fill="#3b82f6" rx="1" />

      <!-- Row 3 -->
      <rect x="70" y="85" width="15" height="12" fill="#ef4444" rx="1" />
      <rect x="85" y="85" width="45" height="12" fill="#3b82f6" rx="1" />

      <!-- Row 4 -->
      <rect x="55" y="105" width="30" height="12" fill="#ef4444" rx="1" />
      <rect x="85" y="105" width="75" height="12" fill="#3b82f6" rx="1" />
    </g>

    <!-- Sub-Section 2: Attention Visualization -->
    <g transform="translate(740, 280)">
      <rect x="0" y="0" width="190" height="145" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#boxShadow)" />
      <text x="95" y="24" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="700">Attention Visualization</text>

      <!-- Heatmap Grid -->
      <rect x="25" y="40" width="140" height="85" rx="3" fill="url(#heatGrad)" opacity="0.85" />
      <!-- Grid Overlay lines -->
      <line x1="25" y1="61" x2="165" y2="61" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
      <line x1="25" y1="82" x2="165" y2="82" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
      <line x1="25" y1="103" x2="165" y2="103" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />

      <line x1="60" y1="40" x2="60" y2="125" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
      <line x1="95" y1="40" x2="95" y2="125" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
      <line x1="130" y1="40" x2="130" y2="125" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
    </g>

    <!-- Bottom Caption: Transparent & Interpretable Results -->
    <g transform="translate(740, 445)">
      <rect x="0" y="0" width="190" height="46" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#boxShadow)" />
      <text x="95" y="20" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="700">Transparent &amp; Interpretable</text>
      <text x="95" y="36" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="700">Examination Results</text>
    </g>
  </g>

  <!-- Bottom Title Caption -->
  <text x="500" y="615" text-anchor="middle" fill="#64748b" font-size="12" font-weight="600">
    FIG. 1: Autonomous Examination Management &amp; Evaluation Framework Architecture Pipeline
  </text>
</svg>
